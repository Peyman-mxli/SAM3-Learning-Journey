name: Project 13 Environmental Validation

on:
  push:
    paths:
      - ".github/workflows/project13-validation.yml"
      - "05-projects/13-Visual-Tracking-and-Analysis-Lab/evaluation/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics supervision opencv-python-headless numpy pandas

      - name: Create validation videos
        working-directory: 05-projects/13-Visual-Tracking-and-Analysis-Lab
        run: python evaluation/create_condition_variants.py data/input/tracking_test_01.mp4

      - name: Run validation sessions
        working-directory: 05-projects/13-Visual-Tracking-and-Analysis-Lab
        run: |
          python evaluation/run_validation_suite.py \
            --video-dir data/validation_videos \
            --db data/project13_validation.sqlite3 \
            --output-dir results/validation \
            --model yolov8n.pt \
            --confidence 0.35

      - name: Analyze conditions
        working-directory: 05-projects/13-Visual-Tracking-and-Analysis-Lab
        run: python evaluation/analyze_validation_conditions.py --results-dir results/validation

      - name: Build report
        working-directory: 05-projects/13-Visual-Tracking-and-Analysis-Lab
        run: python evaluation/build_validation_report.py --results-dir results/validation

      - name: Remove temporary generated data
        working-directory: 05-projects/13-Visual-Tracking-and-Analysis-Lab
        run: |
          rm -rf data/validation_videos
          rm -f data/project13_validation.sqlite3

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05-projects/13-Visual-Tracking-and-Analysis-Lab/results/validation
          git add 05-projects/13-Visual-Tracking-and-Analysis-Lab/docs/ENVIRONMENTAL-VALIDATION-RESULTS.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add Project 13 environmental validation results"
            git push
          fi
