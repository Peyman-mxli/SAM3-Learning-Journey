name: Project 13 Ground Truth Review Packet

on:
  push:
    paths:
      - ".github/workflows/project13-ground-truth-packet.yml"
      - "05-projects/13-Visual-Tracking-and-Analysis-Lab/evaluation/generate_ground_truth_review_packet.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics supervision opencv-python-headless pandas

      - name: Generate review packet
        working-directory: 05-projects/13-Visual-Tracking-and-Analysis-Lab
        run: |
          rm -rf evaluation/review_packet
          python evaluation/generate_ground_truth_review_packet.py \
            data/input/tracking_test_01.mp4 \
            --output-dir evaluation/review_packet \
            --model yolov8n.pt \
            --confidence 0.35 \
            --every 5 \
            --max-frames 15

      - name: Commit review packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05-projects/13-Visual-Tracking-and-Analysis-Lab/evaluation/review_packet
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Generate Project 13 ground-truth review packet"
            git push
          fi
